name: fresque
description: Real-time collaborative whiteboard for Flutter, with drawing tools, stylus support and offline edits. Client of the Fresque Go server.
version: 0.8.0
publish_to: none
repository: https://github.com/citadellefr/fresque
issue_tracker: https://github.com/citadellefr/fresque/issues
topics: [whiteboard, collaboration, drawing, canvas, websocket]

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.3.0
  image: ^4.10.1
  trame:
    git:
      url: https://github.com/citadellefr/trame.git
      path: dart
      ref: v0.4.0

dev_dependencies:
  fake_async: ^1.3.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
